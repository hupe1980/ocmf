<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "TechArticle",
  "headline": {{ page.title | json_encode | safe }},
  "description": {{ page.description | json_encode | safe }},
  "url": {{ page.permalink | json_encode | safe }},
  "inLanguage": "en",
  "isPartOf": {
    "@type": "WebSite",
    "name": {{ config.title | json_encode | safe }},
    "url": {{ config.base_url | json_encode | safe }}
  },
  "author": { "@type": "Person", "name": {{ config.author | json_encode | safe }} },
  "about": { "@type": "Thing", "name": "Open Charge Metering Format" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": {{ config.base_url | json_encode | safe }} },
    { "@type": "ListItem", "position": 2, "name": "Documentation", "item": {{ (config.base_url ~ "/docs/") | json_encode | safe }} },
    { "@type": "ListItem", "position": 3, "name": {{ page.title | json_encode | safe }}, "item": {{ page.permalink | json_encode | safe }} }
  ]
}
</script>
{% if page.extra.faq %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {%- for item in page.extra.faq %}
    {
      "@type": "Question",
      "name": {{ item.q | json_encode | safe }},
      "acceptedAnswer": { "@type": "Answer", "text": {{ item.a | json_encode | safe }} }
    }{% if not loop.last %},{% endif %}
    {%- endfor %}
  ]
}
</script>
{% endif %}
