[toolchain]
# **This file overrides the toolchain a workflow selects.** `rustup default`,
# and therefore `dtolnay/rust-toolchain@<version>`, loses to a directory
# override — so a CI job that installs 1.88 and then runs a bare `cargo check`
# is checking 1.98. Naming the toolchain on the command line (`cargo +1.88.0`)
# or setting `RUSTUP_TOOLCHAIN` is the only way past it, and a target this file
# does not list has to be added to *this* toolchain, not to `stable`.
#
# The channel everything here is built and tested with. It is deliberately not
# the same number as the MSRV. `rust-version = "1.88"` in Cargo.toml is the
# promise made to consumers, and `just msrv` proves it against that toolchain
# rather than asserting it here.
#
# 1.88 and not edition 2024's 1.85 floor, for one reason: let-chains
# (`if let Some(x) = a && …`) stabilised there, and `session.rs` reads better
# with them than with the nested `if let` they replace. `quick-xml` 0.42 —
# behind the optional `xml` feature — independently requires 1.86.
channel    = "1.98"
components = ["rustfmt", "clippy"]
targets    = ["thumbv7em-none-eabihf", "wasm32-unknown-unknown"]
